
name: CloudCart CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build CloudCart Docker image
        run: |
          docker build \
            -t amxnn/cloudcart:latest \
            -t amxnn/cloudcart:${{ github.sha }} \
            .

      - name: Push CloudCart Docker images
        run: |
          docker push amxnn/cloudcart:latest
          docker push amxnn/cloudcart:${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CloudCart image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            amxnn/cloudcart:latest
            amxnn/cloudcart:${{ github.sha }}

      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ CloudCart CI/CD SUCCESS\nRepository: $GITHUB_REPOSITORY\nBranch: $GITHUB_REF_NAME\nCommit: $GITHUB_SHA\nDocker image: amxnn/cloudcart:latest\"}" \
            "$SLACK_WEBHOOK_URL"

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ CloudCart CI/CD FAILED\nRepository: $GITHUB_REPOSITORY\nBranch: $GITHUB_REF_NAME\nCommit: $GITHUB_SHA\nCheck GitHub Actions for error details.\"}" \
            "$SLACK_WEBHOOK_URL"
